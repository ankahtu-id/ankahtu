<style>
:root{--p:#d9a9b2;--a:#e8c9a8;--bg:#fff;--ft:#4b4650;--font:'Poppins',sans-serif;--lbg:none;--soft:#fff5f7;--soft2:#f4f0fb;--soft3:#eff7f5;--soft4:#fff8ed}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--ft);background:var(--bg)}
h1,h2,h3{margin:.3em 0}.hide{display:none!important}.sm{font-size:.82rem;opacity:.8}
.btn{background:var(--p);color:#fff;border:1px solid var(--p);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-size:.84rem}
.btn.s{background:transparent;color:var(--p)}.btn.r{background:transparent;color:#c0392b;border-color:#c0392b}.btn:hover{opacity:.85}
input,select,textarea{font:inherit;font-size:.9rem;padding:8px;border:1px solid #0003;border-radius:8px;width:100%;background:#fff;color:#222}
label{display:block;font-size:.8rem;margin:8px 0;font-weight:600}input[type=color]{padding:2px;height:38px}input[type=checkbox]{width:auto;transform:scale(1.2)}
#app{display:flex;min-height:100vh}aside{width:232px;background:linear-gradient(170deg,var(--p),var(--a));color:#fff;padding:16px 10px;position:fixed;top:0;bottom:0;overflow:auto;z-index:20}
aside h3{text-align:center;letter-spacing:3px;margin-bottom:14px}.nav a{display:block;padding:10px 12px;border-radius:8px;color:#fff;cursor:pointer;font-size:.88rem;margin-bottom:2px}.nav a.on,.nav a:hover{background:#ffffff38}
main{margin-left:232px;padding:20px;flex:1;min-width:0}.mt{display:none}
.card{background:#ffffffd9;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.note{border-left:4px solid var(--a);font-size:.85rem}
.hero{text-align:center;background:linear-gradient(135deg,#ffffffcc,#ffffff55);border-radius:20px;padding:26px 14px;box-shadow:0 2px 16px #0001}
.hero h2 span{color:var(--p)}.names{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;margin:16px 0}.ph{text-align:center}
.ph img,.ph .nop{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--a);display:block;margin:auto;background:#0001}
.ph span{display:block;margin-top:8px;font-size:1.7rem;font-weight:700;color:var(--p);text-shadow:0 2px 8px #0002}.amp{font-size:2.6rem;color:var(--a)}
.cd{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}.cd div{background:var(--p);color:#fff;border-radius:12px;padding:10px 14px;min-width:72px;font-size:.8rem}.cd b{display:block;font-size:1.7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.grid .card{margin:0;text-align:center;cursor:pointer}.grid b{font-size:1.6rem;color:var(--p)}
.bar,.stick{height:24px;background:#00000014;border-radius:12px;overflow:hidden;display:flex;margin:8px 0}.bar i{background:var(--p);display:block}.seg{height:100%;transition:width .4s}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.tb input[type=search],.tb input[type=number]{max-width:200px}
.tw{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid #0001;text-align:left;vertical-align:top}th{background:#0000000d;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.chip{background:var(--p);color:#fff;padding:4px 11px;border-radius:20px;font-size:.78rem}.chip.w{background:#c0392b}
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}#modal>div{background:#fff;color:#222;border-radius:14px;padding:20px;width:min(500px,100%);max-height:90vh;overflow:auto}
.flow{display:flex;gap:6px;flex-wrap:wrap}.flow div{flex:1;min-width:140px;background:var(--p);color:#fff;padding:10px;border-radius:10px;font-size:.8rem}.flow div:nth-child(even){background:var(--a)}
.sw{display:inline-block;width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0004;cursor:pointer;margin:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#0001}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 18px;border-radius:22px;z-index:99;font-size:.85rem;max-width:92vw;text-align:center}
#pa{display:none}
@media(max-width:780px){aside{transform:translateX(-100%);transition:.2s}aside.open{transform:none}main{margin-left:0;padding:12px}.mt{display:inline-block;margin-bottom:8px}.two{grid-template-columns:1fr}}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}#pa table{font-size:11px;border-collapse:collapse}#pa td,#pa th{border:1px solid #666;padding:3px}}

main{padding:26px 30px}.card{background:#fff;border:1px solid #f1e9ee;border-radius:18px;box-shadow:0 8px 28px #8f758010;padding:20px}.hero{display:flex;align-items:center;text-align:left;gap:28px;background:linear-gradient(120deg,#fff9fa,#f8f5fb 65%,#f2f8f5);border:1px solid #f0e7ed;padding:28px;border-radius:24px}.hero-copy{flex:1}.hero-photo{width:220px;min-width:180px}.hero-photo img,.hero-photo .nop{width:100%;height:245px;object-fit:cover;border-radius:20px;border:5px solid #fff;box-shadow:0 12px 30px #8f758025}.hero h2{font-size:1.65rem}.hero h2 span{color:#bd8997}.hero .names{justify-content:flex-start;margin:10px 0}.hero .names .ph{display:none}.hero .amp{display:none}.hero .cd{justify-content:flex-start}.hero .cd div{background:#fff;color:#8c7182;border:1px solid #f0e3eb;min-width:75px;box-shadow:0 4px 12px #9d829410}.hero .cd b{color:#bd8997}.grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.grid .card{text-align:left;min-height:116px;border-top:3px solid #e7c4cd}.grid .card:nth-child(4n+2){border-top-color:#d8c8e8}.grid .card:nth-child(4n+3){border-top-color:#c7ded5}.grid .card:nth-child(4n){border-top-color:#ead8b8}.grid b{font-size:1.8rem;color:#a87e8e}.stick,.bar{height:30px;border-radius:16px;background:#f5edf1;margin:14px 0}.seg{border-radius:0}.btn{background:linear-gradient(100deg,#d5a7b2,#c7b1d9);border:0;border-radius:10px;box-shadow:0 4px 12px #c49cac20}.btn.s{background:#fff;color:#987889;border:1px solid #eadce5;box-shadow:none}.btn.r{background:#fff5f5;color:#b76b75;border:1px solid #f0d6d9;box-shadow:none}
.tw{border-radius:14px;border:1px solid #f0e7ed}table{border-collapse:separate;border-spacing:0;font-size:.86rem}th{background:#f4edf3;color:#765f70;font-weight:700;padding:12px}td{padding:12px;border-bottom:1px solid #f0e9ef}tbody tr:nth-child(4n+1),table tr:nth-child(4n+2){background:#fff8fa}table tr:nth-child(4n+3){background:#f8f5fc}table tr:nth-child(4n){background:#f2f8f5}table tr:hover{filter:brightness(.985)}
.chip{background:#f5e8ed;color:#8c6879;border:1px solid #efdee6}.chip.w{background:#fff1ed;color:#a7655d}.note{background:#fffaf2;border-left-color:#e7c89c}.flow{display:none}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.thumb{width:90px;height:90px;border-radius:12px;object-fit:cover;border:2px solid #f0e7ed}
.route-list{list-style:none;padding:0;margin:12px 0}.route-item{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding:0 0 18px}.route-item:not(:last-child):before{content:'';position:absolute;left:15px;top:30px;bottom:-2px;width:2px;background:linear-gradient(#d8b8c6,#d8d0e7)}.route-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#f6e9ef;color:#956f80;font-weight:700;z-index:1}.route-body{background:#fff;border:1px solid #f0e7ed;border-radius:13px;padding:12px 14px}.route-date{font-size:.76rem;color:#a17f8e;font-weight:700}.hminus{display:inline-block;background:#f2edf8;color:#816b98;border-radius:20px;padding:3px 9px;font-size:.72rem;font-weight:700}

@media(max-width:780px){main{padding:12px}.hero{display:block;text-align:center}.hero-photo{width:170px;margin:0 auto 18px}.hero-photo img,.hero-photo .nop{height:190px}.hero .names,.hero .cd{justify-content:center}.two{grid-template-columns:1fr}}


/* ANKAHTU refined: strong single accent + monochrome outline icons */
:root{--p:#002C88;--a:#002C88;--bg:#ffffff;--ft:#1F2A44;--icon:#002C88}
body{background:var(--bg)!important;color:var(--ft)!important}
body,body *{font-family:var(--font)}
h1,h2,h3,h4,p,label,td,th,.sm,.hero-copy,.card{color:inherit}
aside{background:var(--bg)!important;color:var(--ft)!important;border-right:1px solid #e7e2e4;box-shadow:5px 0 24px #0000000a}
aside h3{color:var(--p)!important}
.nav a{color:var(--ft)!important;display:flex;align-items:center;gap:11px}
.nav a.on,.nav a:hover{background:color-mix(in srgb,var(--p) 10%,white)!important;color:var(--p)!important;box-shadow:inset 3px 0 var(--p)!important}
.nav-ico,.line-ico{width:20px;height:20px;display:inline-flex;flex:0 0 20px;align-items:center;justify-content:center;color:var(--p)}
.nav-ico svg,.line-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{background:var(--p)!important;border:1px solid var(--p)!important;color:#fff!important;box-shadow:none!important}
.btn.s{background:#fff!important;color:var(--p)!important;border:1px solid var(--p)!important}
.btn.r{background:#fff!important;color:#9d1c35!important;border:1px solid #9d1c35!important}
.card{background:#fff;border-color:#e9e4e6;box-shadow:0 5px 20px #0000000a}
.hero{background:#fff;border-color:#e9e4e6}
.hero h2 span,.hero .cd b,.grid b{color:var(--p)!important}
.grid .card{border-top:3px solid var(--p)!important}
.grid .card:nth-child(n){border-top-color:var(--p)!important}
.chip{background:color-mix(in srgb,var(--p) 10%,white)!important;color:var(--p)!important;border-color:color-mix(in srgb,var(--p) 20%,white)!important}
.stick,.bar{height:34px;border-radius:18px;background:#ece9ea;overflow:hidden;display:flex}
.stick .seg{height:100%;display:block;min-width:0}
.leg i{border-radius:50%}
.route-item:not(:last-child):before{background:var(--p)!important;opacity:.35}
.route-dot{background:color-mix(in srgb,var(--p) 12%,white)!important;color:var(--p)!important}
.route-body{border-color:#e9e4e6}
.hminus{background:color-mix(in srgb,var(--p) 10%,white)!important;color:var(--p)!important}
input,select,textarea{color:var(--ft)!important}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--p) 35%,white);border-color:var(--p)}
.concept-field{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #eee}
.concept-field textarea{min-height:70px}
.concept-photo img{width:100%;height:105px;object-fit:cover;border-radius:10px;border:1px solid #e7e1e3}
.concept-photo .btn{margin-top:5px;padding:5px 9px;font-size:.75rem}
.photo-quota{font-size:.78rem;color:var(--ft);opacity:.8;margin:6px 0}
@media(max-width:650px){.concept-field{grid-template-columns:1fr}.concept-photo{max-width:180px}}


.dash-progress{margin-top:16px}.dash-progress h3{margin:0 0 10px}.dash-row{padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer}.dash-row:last-child{border-bottom:0}.dash-row-head,.dash-row-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}.dash-row-head span{display:flex;align-items:center;gap:10px}.dash-row-head b{font-size:1rem}.dash-row-head strong{font-size:1rem;color:var(--p)}.dash-track{height:13px;background:#f0edf0;border-radius:20px;overflow:hidden;margin:10px 0 6px}.dash-track i{display:block;height:100%;border-radius:20px;transition:width .4s}.dash-row-foot{font-size:.76rem;color:#887f88}.dash-row:hover{background:#fffafb}

/* ===== LOGIN ANKAHTU: biru logo, minimalis ===== */
#login{--lb:#1f4e9e;--lbd:#173f80;--lbn:#12306b;position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);overflow:auto;padding:0;min-height:0;background:#fff!important;transition:transform .95s cubic-bezier(.77,0,.18,1)}
#login.login-leave{transform:translateY(-100%);pointer-events:none}
.lg-art{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:48px;text-align:center;color:#fff;background:radial-gradient(110% 80% at 15% 5%,#2c64bd 0%,transparent 58%),linear-gradient(155deg,#173f80 0%,#1f4e9e 58%,#2459b5 100%)}
.lg-art:before{content:'';position:absolute;inset:26px;border:1px solid #ffffff2e;border-radius:26px;pointer-events:none}
.lg-logo{width:min(430px,78%);position:relative}.lg-logo svg{display:block;width:100%;height:auto;color:#fff}
.lg-tag{position:relative;margin:0;max-width:330px;font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-style:italic;line-height:1.7;color:#ffffffd1}
.lg-form{display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,72px);background:#fff}
.lc{width:min(380px,100%);padding:0;background:none;border:0;box-shadow:none;text-align:left}
.lc h2{font-family:'Cormorant Garamond',serif;font-size:2.7rem;font-weight:600;color:var(--lbn);margin:0 0 6px;line-height:1.1}
.lg-sub{color:#6b7a94;font-size:.92rem;line-height:1.7;margin:0 0 30px}
.lc label{display:block;margin:0 0 18px;font-weight:600;color:#4a5a78}
.lbl{display:block;margin-bottom:8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.lc input{height:50px;padding:0 15px;font-weight:400;border:1px solid #d9e1ef;border-radius:12px;background:#fff;color:var(--lbn)!important;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.lc input::placeholder{color:#a3aec4}
.lc input:focus{outline:0;border-color:var(--lb);box-shadow:0 0 0 4px #002c881f}
.lc input:-webkit-autofill{-webkit-box-shadow:0 0 0 50px #fff inset;-webkit-text-fill-color:#12306b}
.password-wrap{position:relative}.password-wrap input{padding-right:54px}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#6b7a94;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.eye-btn:hover{background:#eef3fb;color:var(--lb)}
.eye-btn .line-ico{color:inherit}.eye-btn .off{display:none}.eye-btn.on .off{display:inline-flex}.eye-btn.on .see{display:none}
.err{min-height:20px;margin:-4px 0 14px;color:#c0392b;font-size:.84rem}
#login .btn{width:100%;height:50px;border-radius:12px;background:var(--lb)!important;border:1px solid var(--lb)!important;color:#fff!important;font-weight:600;font-size:.95rem;letter-spacing:.02em;cursor:pointer;transition:background .2s}
#login .btn:hover{background:var(--lbd)!important;border-color:var(--lbd)!important;opacity:1}
#login .btn:disabled{opacity:.7;cursor:wait}
.lg-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;color:#8a97ae;font-size:.74rem}
.lg-note .line-ico{width:16px;height:16px;flex-basis:16px;color:#8a97ae}.lg-note .line-ico svg{width:16px;height:16px}
@media(max-width:850px){#login{grid-template-columns:1fr;grid-template-rows:auto 1fr}.lg-art{padding:30px 24px 26px;gap:0}.lg-art:before{display:none}.lg-logo{width:min(200px,56%)}.lg-tag{display:none}.lg-form{align-items:flex-start;padding:34px 24px 40px}.lc h2{font-size:2.1rem}}

/* ===== TEMA BIRU LOGO ANKAHTU (#002C88) ===== */
:root{--p2:color-mix(in srgb,var(--p) 42%,#fff);--tint:color-mix(in srgb,var(--p) 6%,#fff);--tint2:color-mix(in srgb,var(--p) 12%,#fff);--line:color-mix(in srgb,var(--p) 16%,#fff)}
#login{--lb:#002C88;--lbd:#001f63;--lbn:#001a4f}
.lg-art{background:radial-gradient(110% 80% at 15% 5%,#1d54c0 0%,transparent 58%),linear-gradient(155deg,#001a55 0%,#002C88 58%,#0a40a8 100%)}
.lg-logo img{display:block;width:100%;height:auto;filter:brightness(0) invert(1)}
.lg-wp{margin-top:22px;letter-spacing:.45em;font-size:.72rem;text-align:center;color:#ffffffcc;font-weight:500}
.side-logo{padding:4px 6px 16px;margin-bottom:12px;border-bottom:1px solid var(--line);text-align:center}
.side-logo img{display:block;width:168px;max-width:100%;height:auto;margin:0 auto}
.card,.hero,.tw,.route-body,.palette-stop,.thumb,.concept-photo img{border-color:var(--line)}
.card{box-shadow:0 6px 22px color-mix(in srgb,var(--p) 7%,transparent)}
.hero{background:linear-gradient(120deg,#fff,var(--tint))}
.hero .cd div{background:#fff;color:var(--p);border:1px solid var(--line);box-shadow:0 4px 12px color-mix(in srgb,var(--p) 8%,transparent)}
.note{background:var(--tint);border-left-color:var(--p)}
th{background:color-mix(in srgb,var(--p) 22%,#fff);color:var(--p)}.route-date{color:var(--p);opacity:.8}
td{border-bottom:1px solid var(--line)}
table tr:nth-child(even){background:var(--tint)}
table tr:nth-child(odd){background:var(--tint2)}
table tr:hover{filter:none;background:color-mix(in srgb,var(--p) 18%,#fff)}
.stick,.bar,.dash-track{background:var(--tint2)}
.dash-row{border-bottom-color:var(--line)}.dash-row:hover{background:var(--tint)}
.concept-field{border-bottom-color:var(--line)}
@media(max-width:850px){.lg-wp{display:none}}

function img(file,w,q,budget=PHOTO_LIMIT){return new Promise((res,rej)=>{if(!String(file.type).startsWith('image/'))return rej(new Error('File harus berupa gambar.'));const r=new FileReader();r.onerror=()=>rej(new Error('Gagal membaca file.'));r.onload=()=>{const i=new Image();i.onerror=()=>rej(new Error('Gambar tidak valid.'));i.onload=()=>{let width=Math.min(w,i.width),quality=q,out='';for(let z=0;z<12;z++){const scale=width/i.width,c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*scale));c.height=Math.max(1,Math.round(i.height*scale));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',quality);if(dataBytes(out)<=budget)break;if(quality>.42)quality=Math.max(.42,quality-.12);else width=Math.max(320,Math.round(width*.82))}if(dataBytes(out)>budget)return rej(new Error('Tidak cukup ruang tersisa dari batas foto 5 MB. Hapus foto lain atau pilih gambar yang lebih kecil.'));res(out)};i.src=r.result};r.readAsDataURL(file)})}

 aedit:d=>{const c=LIST.find(x=>x.id===d.id);if(!c)return;modal(`<h3>Ubah Pasangan</h3><label>Nama 1<input id="e1" maxlength="60" value="${esc(c.name1)}"></label><label>Nama 2<input id="e2" maxlength="60" value="${esc(c.name2)}"></label><label>Berlaku sampai<input type="date" id="ee" value="${esc(c.expiry)}"></label><div class="tb"><button class="btn" data-a="asave" data-id="${c.id}">Simpan</button><button class="btn s" data-a="closem">Batal</button></div>`)},
 asave:async d=>{try{await api('aUpdate',{id:d.id,name1:$('#e1').value,name2:$('#e2').value,expiry:$('#ee').value});closeM();adminView()}catch(e){fail(e)}},
 ares:async d=>{const p=prompt('Password baru untuk '+d.u+' (min. 8, huruf + angka):');if(!p)return;try{await api('aReset',{username:d.u,password:p});toast('Password direset')}catch(e){fail(e)}}
};
const C={
 tog:d=>{const r=D[d.k].rows.find(x=>x.id===d.id);if(r){r[$(`[data-c=tog][data-id="${d.id}"]`).dataset.field||'done']=$(`[data-c=tog][data-id="${d.id}"]`).checked?1:0;save(d.k);tbl(d.k);if(CUR==='dash'||d.k==='needs'||d.k==='seserahan')render()}},
 img:async(d,el)=>{if(!el.files[0])return;try{const prev=(D[d.m]||{}).img||'',old=dataBytes(prev),budget=Math.max(0,PHOTO_LIMIT-(photoBytes()-old));const im=await img(el.files[0],+d.w,+d.q,budget);D[d.m]=Object.assign(D[d.m]||{},{img:im});const ok=await save(d.m);if(!ok){D[d.m].img=prev;return}settings($('#main'))}catch(e){toast(''+e.message)}},
 theme:liveT
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b);else if(e.target.id==='modal')closeM()});
document.addEventListener('change',e=>{const b=e.target.closest('[data-c]');if(b&&C[b.dataset.c])C[b.dataset.c](b.dataset,b)});
document.addEventListener('input',e=>{const b=e.target.closest('[data-i]');if(!b)return;if(b.dataset.i==='q')tbl(CUR);if(b.dataset.i==='theme')liveT()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lp'||e.target.id==='lu'))doLogin()});

$('#lgW').src=$('#lgB').src;localTheme();
if(T)boot();else{$('#login').classList.remove('hide')}
</script></body></html>
